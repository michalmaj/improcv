[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "improcv"
version = "0.3.0a1"
description = "Modern image-processing and computer-vision utilities for Python, NumPy and OpenCV."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Michał Maj" }]
keywords = ["opencv", "image-processing", "computer-vision", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

# improcv does not pin any one OpenCV distribution as a hard runtime
# dependency, to avoid installing a conflicting variant a user already
# has installed under a different name. Choose exactly one:
#   pip install "improcv[cv]"                  # opencv-python
#   pip install "improcv[cv-headless]"         # opencv-python-headless
#   pip install "improcv[cv-contrib]"          # opencv-contrib-python
#   pip install "improcv[cv-contrib-headless]" # opencv-contrib-python-headless
# or install one of the four `opencv-*` packages yourself.
[project.optional-dependencies]
cv = ["opencv-python>=4.9,<6"]
cv-headless = ["opencv-python-headless>=4.9,<6"]
cv-contrib = ["opencv-contrib-python>=4.9,<6"]
cv-contrib-headless = ["opencv-contrib-python-headless>=4.9,<6"]
viz = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/michalmaj/improcv"
Repository = "https://github.com/michalmaj/improcv"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
    "pyright>=1.1",
    "opencv-python-headless>=4.9,<6",
    "matplotlib>=3.8",
]
# Opt-in only: `uv run --group benchmark pytest benchmarks/`. Never pulled in by a plain
# `uv sync`/`uv run pytest` (which only resolve the default `dev` group), and never a runtime
# dependency or public extra -- benchmarks/ lives outside [tool.pytest.ini_options].testpaths,
# so this group exists solely to make pytest-benchmark available when someone asks for it.
benchmark = [
    "pytest-benchmark>=5.2.3",
]

[tool.uv]
# Pins the exact Hatchling version `uv build` resolves into its isolated
# build environment, for release.yml specifically -- deliberately kept
# separate from [build-system].requires (left as a loose "hatchling" there),
# since over-constraining that field would also affect anyone building
# improcv from the sdist in their own environment, not just this project's
# own release pipeline. Bump deliberately, not automatically, when adopting
# a newer Hatchling.
build-constraint-dependencies = ["hatchling==1.31.0"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "scripts", "examples", "demos", "benchmarks"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# `benchmarks/benchmark_augmentation.py` doesn't match pytest's default `test_*.py`/`*_test.py`
# file-name glob, so it would never be collected at all -- explicit `--group benchmark` or not --
# without this. `benchmarks/` staying outside `testpaths` above is what actually keeps it out of
# a plain `uv run pytest`; this only makes it collectible once someone points pytest at it.
python_files = ["test_*.py", "*_test.py", "benchmark_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/improcv"]
